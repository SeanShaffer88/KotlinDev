# Release AAB — manual dispatch; builds bundleRelease and uploads the
# Android App Bundle as a workflow artifact for Play Console upload.
# Copy to .github/workflows/release-aab.yml in your app repo.
#
# Signing: release signing must come from CI secrets, never from files
# committed to the repo. Expected secrets (set in repo Settings → Secrets):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         upload key alias
#   ANDROID_KEY_PASSWORD      upload key password
# Wire them into app/build.gradle.kts via environment variables in a
# signingConfigs block. This workflow only decodes the keystore to a
# temp file and never prints any secret value.
name: Release AAB

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name for this build (informational)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret configured — building unsigned bundle for inspection."
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
